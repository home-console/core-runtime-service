# ─────────────────────────────────────────────────────────────────────────────
# dev-reload: горячая перезагрузка без пересборки контейнера
#
# Режим                 Compose-файл
# ──────────────────────────────────────────────────────────────────────────
# dev                   deploy/dev/docker-compose.yml          (build из src)
# dev-reload  ← ВЫ ЗДЕСЬ  deploy/dev/docker-compose.reload.yml  (build + live src mount + watchfiles)
# dev-image             deploy/dev/docker-compose.image.yml   (образ + dev-инфра)
# prod                  deploy/prod/docker-compose.image.yml  (образ из registry, prod-инфра)
#
# Что делает этот файл:
#   - core-runtime: образ собирается из src; src монтируется обратно в /app.
#     watchfiles следит за *.py — перезапускает "python main.py" при изменениях.
#     Зависимости (pip) берутся из образа, исходники — с хоста. Рестарт < 1 сек.
#   - redis: идентично dev
#   - caddy: по умолчанию отдаёт статику из ./frontend (результат pnpm build:web)
#
# ─── Опция --profile frontend (HMR для frontend) ─────────────────────────────
#   Запускает контейнер с Vite dev server (HMR) из platform-home-console.
#   Caddy переключается на проксирование к Vite через CADDYFILE_PATH.
#
# ─── Использование ───────────────────────────────────────────────────────────
#
# Параллельно с prod: dev порты с префиксом «1» чтобы не конфликтовать
# со стандартными prod-портами на той же машине.
#   UI:        http://localhost:18080   (DEV_HTTP_PORT)
#   Core API:  http://localhost:18000   (DEV_CORE_PORT)
#   Vite HMR:  http://localhost:15173   (DEV_VITE_HOST_PORT)
#   Postgres:  localhost:15432          (DEV_PG_PORT)
#   Redis:     localhost:16379          (DEV_REDIS_PORT)
#
# Backend hot-reload (только Python ядро):
#   docker compose -f deploy/dev/docker-compose.reload.yml up -d
#   hc core up --mode dev-reload
#
# Backend + Frontend HMR:
#   CADDYFILE_PATH=./Caddyfile.hmr \
#   docker compose -f deploy/dev/docker-compose.reload.yml --profile frontend up -d
#
# Остановить:
#   docker compose -f deploy/dev/docker-compose.reload.yml down
# ─────────────────────────────────────────────────────────────────────────────

services:
  redis:
    container_name: dev-hc-redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${DEV_REDIS_PORT:-16379}:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [app]

  postgres:
    container_name: dev-hc-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-homeconsole}
      POSTGRES_USER: ${POSTGRES_USER:-homeconsole}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homeconsole}
      # Роль `vault` (схема `vault`, search_path=vault) — см. postgres-initdb/01-init-vault.sh
      VAULT_PG_PASSWORD: ${VAULT_PG_PASSWORD:-vault}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres-initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DEV_PG_PORT:-15432}:5432"
    healthcheck:
      # -h 127.0.0.1 forces TCP check (without -h pg_isready uses UNIX socket
      # which becomes ready before TCP is bound — causing false-healthy)
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U homeconsole"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks: [app]

  core-runtime:
    container_name: dev-hc-core-runtime
    build:
      context: ../..
      dockerfile: Dockerfile
    # watchfiles перезапускает main.py при изменениях *.py (без полной пересборки)
    command: >-
      sh -c "python -m watchfiles --filter python 'python main.py' /app"
    # root нужен для записи при volume-mount из хоста; только для dev-reload
    user: root
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - EVENT_BUS_BACKEND=${EVENT_BUS_BACKEND:-memory}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      # RUNTIME_STORAGE_MODE / RUNTIME_VAULT_STORAGE_TYPE / RUNTIME_VAULT_PG_DSN
      # НЕ перечисляем здесь: `environment:` всегда побеждает `env_file`, а
      # ${VAR:-default} резолвится из shell-env/.env проекта compose (deploy/dev/.env,
      # которого нет), а не из ../../.env — поэтому такая запись затирала бы
      # значения из core-runtime-service/.env дефолтами. Эти переменные приходят
      # только через env_file ниже.
      - RUNTIME_PLUGINS_DIR=${RUNTIME_PLUGINS_DIR:-/app/plugins}
      - RUNTIME_DB_PATH=${RUNTIME_DB_PATH:-/data/runtime.db}
      - RUNTIME_VAULT_DB_PATH=${RUNTIME_VAULT_DB_PATH:-/data/vault.db}
      - RUNTIME_VAULT_SECRET_DB_PATH=${RUNTIME_VAULT_SECRET_DB_PATH:-/data/vault_secret.db}
    volumes:
      - core-data:/data
      # Live source mount: перекрывает /app из образа живыми файлами.
      # Pip-зависимости остаются в site-packages образа — доступны без переустановки.
      - ../../:/app:cached
    ports:
      - "${DEV_CORE_PORT:-18000}:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/monitor/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [app]

  # ── Frontend HMR (opt-in: docker compose ... --profile frontend) ──────────
  # Запускает Vite dev server из platform-home-console с HMR.
  # Требует: platform-home-console рядом с core-runtime-service в монорепе.
  frontend-vite:
    container_name: dev-hc-frontend-vite
    image: node:22-alpine
    working_dir: /workspace
    volumes:
      # Монтируем исходники platform-home-console из монорепы
      - ../../../platform-home-console:/workspace:cached
    environment:
      # CI=true prevents pnpm from prompting "remove node_modules?" when no TTY
      CI: "true"
      # Vite proxy /api → core внутри docker-сети (не localhost:18000)
      VITE_CORE_PROXY_TARGET: http://core-runtime:8000
    # Старт фронт-стека:
    #   1) corepack enable                — активировать pnpm версии из packageManager
    #   2) pnpm install --frozen-lockfile — установка зависимостей
    #   3) pnpm api:gen (опционально)     — TypeScript-типы из openapi.json.
    #        В контейнер монтируется только platform-home-console, поэтому
    #        ../core-runtime-service/openapi.json недоступен. Если файл есть
    #        в контейнере — регенерим, иначе используем закоммиченный
    #        packages/types/src/generated.ts. Для ручной регенерации:
    #        pnpm api:gen (на хосте).
    #   4) pnpm -r --filter './packages/**' build
    #      — обязательная пересборка @platform/* пакетов. Если её пропустить,
    #        web получает стейл dist/* и в браузере вылезает
    #        "module ... does not provide an export named X" даже если
    #        src/ уже содержит этот экспорт.
    #   5) pnpm -r --filter './packages/**' run --if-present dev > /tmp/...&
    #      — watch-режим в фоне для @platform/* (tsc -w если объявлен),
    #        чтобы любая правка в packages/*/src сразу пересобирала dist.
    #   6) pnpm --filter=web exec vite --host 0.0.0.0 --port 5173
    #      ВАЖНО: используем `exec vite` напрямую вместо `pnpm run dev`,
    #      т.к. скрипт web@dev сам делает pnpm build пакетов (дублирование шага 4)
    #      и НЕ пробрасывает --host через `-- args` (Vite запускается на 127.0.0.1
    #      и снаружи контейнера недоступен).
    command: >-
      sh -c "
        set -e &&
        corepack enable &&
        pnpm install --frozen-lockfile &&
        if [ -f /workspace/../core-runtime-service/openapi.json ]; then
          pnpm api:gen;
        else
          echo '[startup] api:gen skipped (openapi.json не смонтирован в контейнер; использую committed generated.ts)';
        fi &&
        pnpm -r --filter './packages/**' build &&
        (pnpm -r --parallel --filter './packages/**' run --if-present dev > /tmp/packages-dev.log 2>&1 &) &&
        pnpm --filter=web exec vite --host 0.0.0.0 --port 5173
      "
    ports:
      - "${DEV_VITE_HOST_PORT:-15173}:5173"
    profiles: ["frontend"]
    networks: [app]

  caddy:
    container_name: dev-hc-caddy
    image: caddy:latest
    restart: unless-stopped
    volumes:
      # По умолчанию: статика из ./frontend (как dev).
      # Для frontend HMR: задай CADDYFILE_PATH=./Caddyfile.hmr перед запуском.
      - ${CADDYFILE_PATH:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - ./frontend:/srv:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "${DEV_HTTP_PORT:-18080}:80"
      - "${DEV_HTTPS_PORT:-18443}:443"
    depends_on:
      core-runtime:
        condition: service_healthy
    networks: [app]

volumes:
  core-data:
  caddy-data:
  caddy-config:
  pg-data:

networks:
  app:
    driver: bridge
