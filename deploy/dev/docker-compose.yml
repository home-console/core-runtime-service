# Dev stage docker-compose (builds from local source)
#
# Параллельно с prod (deploy/prod): порты по умолчанию НЕ конфликтуют с 80/443/6379.
#   DEV_HTTP_PORT=18080   DEV_HTTPS_PORT=18443   DEV_REDIS_PORT=6380   DEV_CORE_PORT=18000
# Имена контейнеров: dev-hc-redis, dev-hc-postgres, dev-hc-core-runtime, dev-hc-caddy.
#
# Usage:
#   1. Build frontend:   cd platform-home-console && pnpm build:web
#   2. Copy dist:        cp -r platform-home-console/apps/web/dist ./deploy/dev/frontend/
#   3. Run:              docker compose -f deploy/dev/docker-compose.yml up -d
#   4. Open UI:          http://localhost:${DEV_HTTP_PORT:-18080}   (не :80 — его занимает prod edge)
#
# For "prod-like" (image-only) runs, see:
#   deploy/dev/docker-compose.image.yml

services:
  redis:
    container_name: dev-hc-redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${DEV_REDIS_PORT:-6380}:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    container_name: dev-hc-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-homeconsole}
      POSTGRES_USER: ${POSTGRES_USER:-homeconsole}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homeconsole}
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "${PG_PORT:-5432}:5432"
    healthcheck:
      # -h 127.0.0.1 forces TCP check (without -h pg_isready uses UNIX socket
      # which becomes ready before TCP is bound — causing false-healthy)
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U homeconsole"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s

  core-runtime:
    container_name: dev-hc-core-runtime
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      - LOG_LEVEL=info
      - EVENT_BUS_BACKEND=${EVENT_BUS_BACKEND:-memory}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - RUNTIME_STORAGE_MODE=${RUNTIME_STORAGE_MODE:-dual}
      - RUNTIME_VAULT_STORAGE_TYPE=${RUNTIME_VAULT_STORAGE_TYPE:-sqlite}
      - RUNTIME_VAULT_PG_DSN=${RUNTIME_VAULT_PG_DSN:-}
      - RUNTIME_PLUGINS_DIR=${RUNTIME_PLUGINS_DIR:-/app/plugins}
      # Run as non-root; keep SQLite DBs on the mounted /data volume.
      - RUNTIME_DB_PATH=${RUNTIME_DB_PATH:-/data/runtime.db}
      - RUNTIME_VAULT_DB_PATH=${RUNTIME_VAULT_DB_PATH:-/data/vault.db}
      - RUNTIME_VAULT_SECRET_DB_PATH=${RUNTIME_VAULT_SECRET_DB_PATH:-/data/vault_secret.db}
    volumes:
      - core-data:/data
      # Volume mode: mount repo plugins dir into container for auto-load.
      - ../../plugins:/app/plugins:ro
    ports:
      - "${DEV_CORE_PORT:-18000}:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/monitor/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  caddy:
    container_name: dev-hc-caddy
    image: caddy:latest
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend:/srv:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "${DEV_HTTP_PORT:-18080}:80"
      - "${DEV_HTTPS_PORT:-18443}:443"
    depends_on:
      core-runtime:
        condition: service_healthy

volumes:
  core-data:
  caddy-data:
  caddy-config:
  pg-data:
