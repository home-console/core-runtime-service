# Dev stage docker-compose (builds from local source)
# Usage:
#   1. Build frontend:   cd platform-home-console && pnpm build:web
#   2. Copy dist:        cp -r platform-home-console/apps/web/dist ./deploy/dev/frontend/
#   3. Run:              docker compose -f deploy/dev/docker-compose.yml up -d
#   4. Open:             http://localhost (Caddy)
#
# For "prod-like" (image-only) runs, see:
#   deploy/dev/docker-compose.image.yml

services:
  redis:
    image: redis:7-alpine
    container_name: core-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  core-runtime:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: core-runtime
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      - LOG_LEVEL=info
      - EVENT_BUS_BACKEND=${EVENT_BUS_BACKEND:-memory}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - RUNTIME_STORAGE_MODE=${RUNTIME_STORAGE_MODE:-dual}
      - RUNTIME_VAULT_STORAGE_TYPE=${RUNTIME_VAULT_STORAGE_TYPE:-sqlite}
      - RUNTIME_VAULT_PG_DSN=${RUNTIME_VAULT_PG_DSN:-}
      - RUNTIME_PLUGINS_DIR=${RUNTIME_PLUGINS_DIR:-/app/plugins}
      # Run as non-root; keep SQLite DBs on the mounted /data volume.
      - RUNTIME_DB_PATH=${RUNTIME_DB_PATH:-/data/runtime.db}
      - RUNTIME_VAULT_DB_PATH=${RUNTIME_VAULT_DB_PATH:-/data/vault.db}
      - RUNTIME_VAULT_SECRET_DB_PATH=${RUNTIME_VAULT_SECRET_DB_PATH:-/data/vault_secret.db}
    volumes:
      - core-data:/data
      # Volume mode: mount repo plugins dir into container for auto-load.
      - ../../plugins:/app/plugins:ro
    ports:
      - "18000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/monitor/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend:/srv:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      core-runtime:
        condition: service_healthy

volumes:
  core-data:
  caddy-data:
  caddy-config:
