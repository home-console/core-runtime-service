version: "3.8"

# Dev stage docker-compose
# Usage:
#   1. Build frontend:   cd platform-home-console && pnpm build:web
#   2. Copy dist:        cp -r platform-home-console/apps/web/dist ./deploy/dev/frontend/
#   3. Run:              docker compose -f deploy/dev/docker-compose.yml up -d
#   4. Open:             http://localhost (Caddy)

services:
  core-runtime:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: core-runtime
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      - LOG_LEVEL=info
      # Run as non-root; keep SQLite DBs on the mounted /data volume.
      - RUNTIME_DB_PATH=${RUNTIME_DB_PATH:-/data/runtime.db}
      - RUNTIME_VAULT_DB_PATH=${RUNTIME_VAULT_DB_PATH:-/data/vault.db}
      - RUNTIME_VAULT_SECRET_DB_PATH=${RUNTIME_VAULT_SECRET_DB_PATH:-/data/vault_secret.db}
    volumes:
      - core-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/monitor/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend:/srv:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      core-runtime:
        condition: service_healthy

volumes:
  core-data:
  caddy-data:
  caddy-config:
