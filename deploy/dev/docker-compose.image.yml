# Dev-image: готовый образ ядра + dev-Caddy + те же порты, что docker-compose.yml
# (совместимо с параллельным prod stack на 80/443).
#
#   DEV_HTTP_PORT=18080  DEV_HTTPS_PORT=18443  DEV_REDIS_PORT=16379  DEV_CORE_PORT=18000
#
# Usage:
#   CORE_RUNTIME_IMAGE=ghcr.io/<org>/<repo>/core-runtime:TAG \
#   PLATFORM_IMAGE=ghcr.io/home-console/platform-home-console:TAG \
#   docker compose -f deploy/dev/docker-compose.image.yml up -d

services:
  redis:
    container_name: image-hc-redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${DEV_REDIS_PORT:-16379}:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  core-runtime:
    container_name: image-hc-core-runtime
    image: ${CORE_RUNTIME_IMAGE:-ghcr.io/home-console/core-runtime:latest}
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      - LOG_LEVEL=info
      - EVENT_BUS_BACKEND=${EVENT_BUS_BACKEND:-memory}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - RUNTIME_STORAGE_MODE=${RUNTIME_STORAGE_MODE:-dual}
      - RUNTIME_VAULT_STORAGE_TYPE=${RUNTIME_VAULT_STORAGE_TYPE:-sqlite}
      - RUNTIME_VAULT_PG_DSN=${RUNTIME_VAULT_PG_DSN:-}
      - RUNTIME_PLUGINS_DIR=${RUNTIME_PLUGINS_DIR:-/app/plugins}
      # Run as non-root; keep SQLite DBs on the mounted /data volume.
      - RUNTIME_DB_PATH=${RUNTIME_DB_PATH:-/data/runtime.db}
      - RUNTIME_VAULT_DB_PATH=${RUNTIME_VAULT_DB_PATH:-/data/vault.db}
      - RUNTIME_VAULT_SECRET_DB_PATH=${RUNTIME_VAULT_SECRET_DB_PATH:-/data/vault_secret.db}
    volumes:
      - core-data:/data
    ports:
      - "${DEV_CORE_PORT:-18000}:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/monitor/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  platform-web:
    container_name: image-hc-platform-web
    image: ${PLATFORM_IMAGE:-ghcr.io/home-console/platform-home-console:latest}
    restart: unless-stopped
    ports:
      - "${PLATFORM_PORT:-3000}:80"
    environment:
      # Core Runtime API URL (docker-compose service name in internal network)
      CORE_RUNTIME_URL: ${CORE_RUNTIME_URL:-http://core-runtime:8000}
      # For local HTTP runs, keep cookies working. In production behind HTTPS set SECURE_COOKIES=true.
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
    depends_on:
      core-runtime:
        condition: service_healthy

  edge:
    container_name: image-hc-edge
    image: caddy:latest
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend:/srv:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "${DEV_HTTP_PORT:-18080}:80"
      - "${DEV_HTTPS_PORT:-18443}:443"
    depends_on:
      core-runtime:
        condition: service_healthy
      platform-web:
        condition: service_started

volumes:
  core-data:
  caddy-data:
  caddy-config:
