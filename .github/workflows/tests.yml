name: CI - Tests

on:
  push: {}
  pull_request: {}

permissions:
  contents: read
  packages: write

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.13]
    steps:
      - uses: actions/checkout@v4
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.lock ]; then pip install -r requirements.lock; elif [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio coverage codecov
      - name: Dependency security audit (pip-audit)
        run: |
          python -m pip install pip-audit
          if [ -f requirements.lock ]; then pip-audit -r requirements.lock; else pip-audit -r requirements.txt; fi
      - name: Architecture dependency report
        run: python scripts/validate_architecture_rules.py --enforce
      - name: Plugin SDK imports guard
        run: python scripts/validate_plugin_sdk_imports.py --root . --enforce
      - name: Plugin SDK usage guard
        run: python scripts/validate_plugin_sdk_usage.py --root . --enforce
      - name: Run tests with coverage
        run: |
          coverage run -m pytest -q
          coverage xml -i
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build_image:
    name: Build & Push Docker image (GHCR)
    runs-on: ubuntu-latest
    needs: tests
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
