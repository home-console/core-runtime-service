# Coolify-ready docker-compose
#
# Deploy:
#   1. Build frontend:  cd ../platform-home-console && pnpm build:web
#   2. Copy dist:       cp -r apps/web/dist ../core-runtime-service/frontend/
#   3. Push & deploy via Coolify (auto-detects docker-compose.yml)
#
# Or local dev:
#   docker compose up -d

services:
  redis:
    image: redis:7-alpine
    container_name: core-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app

  core-runtime:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: core-runtime
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - EVENT_BUS_BACKEND=${EVENT_BUS_BACKEND:-memory}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - RUNTIME_STORAGE_MODE=${RUNTIME_STORAGE_MODE:-dual}
      - RUNTIME_VAULT_STORAGE_TYPE=${RUNTIME_VAULT_STORAGE_TYPE:-sqlite}
      - RUNTIME_VAULT_PG_DSN=${RUNTIME_VAULT_PG_DSN:-}
      - RUNTIME_PLUGINS_DIR=${RUNTIME_PLUGINS_DIR:-/app/plugins}
      # Run as non-root; keep SQLite DBs on the mounted /data volume.
      - RUNTIME_DB_PATH=/data/runtime.db
      - RUNTIME_VAULT_DB_PATH=/data/vault.db
      - RUNTIME_VAULT_SECRET_DB_PATH=/data/vault_secret.db
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - core-data:/data
      # Volume mode: mount local plugins dir for auto-load.
      - ./plugins:/app/plugins:ro
    expose:
      - "8000"
    ports:
      - "18000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/monitor/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - app

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: caddy
    restart: unless-stopped
    volumes:
      - ./frontend:/srv:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      core-runtime:
        condition: service_healthy
    networks:
      - app

volumes:
  core-data:
  caddy-data:
  caddy-config:

networks:
  app:
