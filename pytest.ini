[pytest]
norecursedirs =
  docs

asyncio_mode = auto
testpaths =
  tests
  integration_smokes
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    asyncio: mark test as async
    benchmark: performance benchmark tests
# Keep output readable in CI. -n auto: parallel workers (pytest-xdist).
addopts = -ra -v --import-mode=prepend
