[pytest]
# Docs contain runnable integration snippets that may look like tests (test_*.py),
# but they are not part of the automated test suite.
norecursedirs =
  docs

asyncio_mode = auto
testpaths =
    tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    asyncio: mark test as async
    benchmark: performance benchmark tests
# Keep output readable in CI.
addopts = -ra -v --import-mode=prepend
